<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Hovering a file reference in chat shows a Reveal in File Explorer action">
  <defs>
    <linearGradient id="chatBg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2E5BD8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="720" height="300" rx="14" fill="url(#chatBg)"/>
  <rect x="1" y="1" width="718" height="298" rx="13.5" fill="none" stroke="#2a2e37"/>

  <!-- transcript -->
  <text x="40" y="64" fill="#9aa4b2" font-family="Segoe UI, system-ui, sans-serif" font-size="15">已生成下载脚本，入口文件：</text>

  <!-- the blue file reference -->
  <rect x="40" y="84" width="196" height="30" rx="8" fill="#1b2433" stroke="#2f4a7a"/>
  <path d="M52 96h7l2 2.5h7v7.5h-16Z" fill="none" stroke="#679EFE" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="70" y="104" fill="#679EFE" font-family="Consolas, monospace" font-size="14">B站下载器代码.txt</text>

  <!-- hover cursor -->
  <path d="M196 112l0 18 4.6-4.4 3 7 3.6-1.6-3-6.8 6.2-.2Z" fill="#ffffff" stroke="#111" stroke-width="1.2"/>

  <!-- popup -->
  <g filter="url(#shadow)">
    <rect x="40" y="132" width="268" height="44" rx="11" fill="#232833" stroke="#3a4150"/>
    <path d="M56 146h9l2.4 3h9.6v10.5H56Z" fill="none" stroke="#c9d2df" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="84" y="160" fill="#eef2f8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">在资源管理器中显示</text>
    <text x="238" y="160" fill="#7f8a99" font-family="Consolas, monospace" font-size="12">.txt</text>
  </g>

  <!-- result: explorer window -->
  <g transform="translate(392 44)">
    <rect x="0" y="0" width="288" height="196" rx="10" fill="#1e2127" stroke="#343a45"/>
    <rect x="0" y="0" width="288" height="30" rx="10" fill="#262b34"/>
    <rect x="0" y="18" width="288" height="12" fill="#262b34"/>
    <circle cx="16" cy="15" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="15" r="4" fill="#febc2e"/>
    <circle cx="44" cy="15" r="4" fill="#28c840"/>
    <text x="62" y="19" fill="#9aa4b2" font-family="Segoe UI, system-ui, sans-serif" font-size="11">资源管理器 — I:\work\bili-下载</text>

    <rect x="0" y="30" width="288" height="26" fill="#1a1d23"/>
    <text x="14" y="47" fill="#7f8a99" font-family="Segoe UI, system-ui, sans-serif" font-size="11">← → ↑   I:\work\bili-下载</text>

    <rect x="0" y="56" width="96" height="140" fill="#191c22"/>
    <text x="12" y="76" fill="#7f8a99" font-family="Segoe UI, system-ui, sans-serif" font-size="10">快速访问</text>
    <text x="12" y="96" fill="#9aa4b2" font-family="Segoe UI, system-ui, sans-serif" font-size="10">桌面</text>
    <text x="12" y="114" fill="#9aa4b2" font-family="Segoe UI, system-ui, sans-serif" font-size="10">下载</text>
    <text x="12" y="132" fill="#679EFE" font-family="Segoe UI, system-ui, sans-serif" font-size="10">bili-下载</text>

    <rect x="96" y="56" width="192" height="140" fill="#1b1e24"/>
    <rect x="108" y="70" width="168" height="24" rx="5" fill="#2a4a7a" stroke="#3f6ea8"/>
    <path d="M118 78h7l2 2.5h7v7.5h-16Z" fill="none" stroke="#cfe0ff" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="138" y="86" fill="#eef2f8" font-family="Consolas, monospace" font-size="11">B站下载器代码.txt</text>

    <rect x="108" y="102" width="168" height="20" rx="4" fill="#20242b"/>
    <text x="120" y="116" fill="#8d97a5" font-family="Consolas, monospace" font-size="10">downloader.py</text>
    <rect x="108" y="128" width="168" height="20" rx="4" fill="#20242b"/>
    <text x="120" y="142" fill="#8d97a5" font-family="Consolas, monospace" font-size="10">README.md</text>
  </g>

  <text x="40" y="212" fill="#6f7a89" font-family="Segoe UI, system-ui, sans-serif" font-size="12">悬停文件引用 → 点一下 → 资源管理器打开并选中该文件</text>
</svg>
